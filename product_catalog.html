<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalogue - Bhutan NWFP Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/nwfp_pages.css">
</head>
<body data-title="NWFP Product Catalogue">
  <div class="shell">
    <div id="siteHeader"></div>
    <main class="mx-auto max-w-7xl px-4 py-6">
      <section class="hero-photo rounded-[2rem] p-6 text-white shadow-2xl md:p-10" style="--hero-image:url('assets/nwfp_images/matsutake.jpg')">
        <p class="text-xs font-black uppercase tracking-[.18em] text-yellow-300">Product catalogue</p>
        <h1 class="mt-4 max-w-4xl text-4xl font-black leading-none md:text-6xl">Commercial NWFP categories for market development.</h1>
        <p class="mt-5 max-w-3xl text-sm leading-7 text-emerald-50">A catalogue separate from the sample marketplace, organized by mushrooms, medicinal plants, bamboo and cane, aromatics, dyes, fiber plants, and household products.</p>
      </section>
      <section id="productGrid" class="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-4"></section>
    </main>
    <div id="siteFooter"></div>
  </div>
  <script src="assets/nwfp_plan_data.js"></script>
  <script src="assets/nwfp_pages.js"></script>
</body>
</html>
