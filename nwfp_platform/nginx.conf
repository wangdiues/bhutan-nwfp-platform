# ---------------------------------------------------------------------------
# Nginx configuration for Bhutan NWFP Digital Marketplace
#
# Layout:
#   - Upstream: Gunicorn on port 8000
#   - /static/  served directly from the staticfiles volume
#   - /media/   served directly from the media volume
#   - All other requests proxied to Gunicorn
#   - Gzip compression enabled
#   - 50 MB upload limit (matching Django's NWFP_CONFIG)
#   - Mobile-friendly security headers
#   - X-Forwarded-For propagation for correct client IP in Django
# ---------------------------------------------------------------------------

upstream gunicorn {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # -----------------------------------------------------------------------
    # Upload / body size limit
    # -----------------------------------------------------------------------
    client_max_body_size 50m;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        image/svg+xml
        font/woff
        font/woff2;
    gzip_min_length 1024;

    # -----------------------------------------------------------------------
    # Security / mobile-friendly headers
    # -----------------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-XSS-Protection          "1; mode=block"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=()" always;
    # Allows HTMX and Leaflet to function correctly across origins
    add_header Access-Control-Allow-Origin "$http_origin" always;
    # Inform the WSGI app that the request arrived over HTTP (adjust to
    # "https" when TLS termination is handled upstream of this Nginx)
    proxy_set_header X-Forwarded-Proto $scheme;

    # -----------------------------------------------------------------------
    # Static files — served directly, with long-term caching
    # -----------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Media files — served directly, no long-term cache (content may change)
    # -----------------------------------------------------------------------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Favicon — prevent noisy 404s in logs
    # -----------------------------------------------------------------------
    location = /favicon.ico {
        alias /app/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Proxy all other requests to Gunicorn
    # -----------------------------------------------------------------------
    location / {
        proxy_pass          http://gunicorn;
        proxy_http_version  1.1;

        # Connection reuse
        proxy_set_header    Connection        "";

        # Pass real client information to Django
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffer settings
        proxy_buffering         on;
        proxy_buffer_size       8k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;

        # Do not pass upstream error pages — let Django handle them
        proxy_intercept_errors  off;
    }

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/nwfp_access.log;
    error_log  /var/log/nginx/nwfp_error.log warn;
}
