{% load marketplace_tags %}
<div class="mt-4 space-y-3">
  {% for item in cart_items %}
    <div class="grid gap-3 rounded-xl border bg-white p-4 md:grid-cols-[1fr_auto_auto]">
      <div>
        <strong>{{ item.batch.product.name }}</strong>
        <p class="text-sm text-slate-500">{{ item.batch.product.group.name }} - {{ item.batch.batch_code }}</p>
      </div>
      <span>{{ item.quantity }} x {{ item.batch.unit_price|format_price }}</span>
      <form method="post" action="{% url 'marketplace:cart_remove' item.pk %}">
        {% csrf_token %}
        <button class="rounded-lg border px-3 py-2 text-sm font-semibold">Remove</button>
      </form>
    </div>
  {% empty %}
    <p class="rounded-xl border bg-white p-5 text-slate-600">Your cart is empty.</p>
  {% endfor %}
</div>
