{% load marketplace_tags %}
<article class="overflow-hidden rounded-xl border bg-white shadow-sm">
  <a href="{% url 'marketplace:product_detail' product.slug %}" class="block aspect-[4/3] bg-gradient-to-br from-emerald-800 to-amber-500"></a>
  <div class="p-4">
    <div class="flex items-center justify-between gap-2 text-xs font-bold uppercase text-slate-500">
      <span>{{ product.group.get_dzongkhag_display|default:product.group.dzongkhag|dzongkhag_display }}</span>
      <span>{{ product.get_status_display }}</span>
    </div>
    <h3 class="mt-2 text-lg font-bold"><a href="{% url 'marketplace:product_detail' product.slug %}">{{ product.name }}</a></h3>
    <p class="mt-1 line-clamp-2 text-sm text-slate-600">{{ product.description }}</p>
    <div class="mt-3 flex items-center justify-between">
      <strong class="text-emerald-700">{{ product.price|format_price }} / {{ product.unit }}</strong>
      <a class="rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white" href="{% url 'marketplace:product_detail' product.slug %}">View</a>
    </div>
  </div>
</article>
