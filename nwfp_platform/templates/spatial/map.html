{% extends "base.html" %}
{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}
{% block content %}
<div class="flex flex-wrap items-end justify-between gap-3">
  <div>
    <p class="text-sm font-bold uppercase text-emerald-700">GIS</p>
    <h1 class="text-3xl font-bold">NWFP Resource Map</h1>
  </div>
  <select id="dzongkhagFilter" class="rounded-lg border border-slate-300 px-3 py-2">
    <option value="">All Dzongkhags</option>
    {% for value,label in dzongkhags %}
      <option value="{{ value }}">{{ label }}</option>
    {% endfor %}
  </select>
</div>
<div id="map" class="map-frame mt-4 rounded-xl border bg-white"></div>
{% endblock %}
{% block extra_body %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([27.5, 90.5], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(map);
  let layer;
  function loadSites() {
    const dzongkhag = document.getElementById('dzongkhagFilter').value;
    const url = new URL("{% url 'spatial:sites_geojson' %}", window.location.origin);
    if (dzongkhag) url.searchParams.set('dzongkhag', dzongkhag);
    fetch(url).then((response) => response.json()).then((geojson) => {
      if (layer) layer.remove();
      layer = L.geoJSON(geojson, {
        onEachFeature: function (feature, marker) {
          marker.bindPopup('<strong>' + (feature.properties.name || 'Resource site') + '</strong><br>' + (feature.properties.species || 'Species not recorded'));
        }
      }).addTo(map);
      if (layer.getBounds && layer.getLayers().length) map.fitBounds(layer.getBounds(), { padding: [24, 24] });
    });
  }
  document.getElementById('dzongkhagFilter').addEventListener('change', loadSites);
  loadSites();
</script>
{% endblock %}
