{% extends "base.html" %}
{% block content %}
<div class="flex items-end justify-between gap-3">
  <h1 class="text-3xl font-bold">Documents</h1>
  <a class="rounded-lg bg-emerald-700 px-4 py-2 font-bold text-white" href="{% url 'documents:upload' %}">Upload</a>
</div>
<div class="mt-4 space-y-3">
  {% for document in documents %}
    <a class="block rounded-xl border bg-white p-4" href="{% url 'documents:detail' document.pk %}">
      <strong>{{ document.title }}</strong><span class="ml-2 text-sm text-slate-500">{{ document.get_file_type_display }} - {{ document.get_status_display }}</span>
    </a>
  {% empty %}
    <p class="rounded-xl border bg-white p-5 text-slate-600">No documents found for your active groups.</p>
  {% endfor %}
</div>
{% endblock %}
