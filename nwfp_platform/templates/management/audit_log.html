{% extends "base.html" %}
{% block content %}
<h1 class="text-3xl font-bold">Audit Log</h1>
<div class="mt-4 space-y-3">
  {% for log in audit_logs %}
    <div class="rounded-xl border bg-white p-4">
      <strong>{{ log.get_action_display }}</strong>
      <p class="text-sm text-slate-500">{{ log.user|default:"System" }} - {{ log.object_repr }} - {{ log.timestamp }}</p>
    </div>
  {% empty %}
    <p class="rounded-xl border bg-white p-5 text-slate-600">No audit records yet.</p>
  {% endfor %}
</div>
{% endblock %}
