{% extends "base.html" %}
{% block content %}
<h1 class="text-3xl font-bold">{{ action }} Product</h1>
<form method="post" enctype="multipart/form-data" class="mt-4 grid gap-4 rounded-xl border bg-white p-5 md:max-w-3xl">
  {% csrf_token %}
  {% for field in form %}
    <label class="form-field">
      <span class="mb-1 block text-sm font-semibold">{{ field.label }}</span>
      {{ field }}
      {% for error in field.errors %}<span class="text-sm text-red-700">{{ error }}</span>{% endfor %}
    </label>
  {% endfor %}
  <button class="rounded-lg bg-emerald-700 px-4 py-3 font-bold text-white">{{ action }} product</button>
</form>
{% endblock %}
