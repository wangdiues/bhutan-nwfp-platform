{% extends "base.html" %}
{% block content %}
<div class="flex items-end justify-between gap-3">
  <h1 class="text-3xl font-bold">My Products</h1>
  <a class="rounded-lg bg-emerald-700 px-4 py-2 font-bold text-white" href="{% url 'products:create' %}">Add Product</a>
</div>
<div class="mt-4 space-y-3">
  {% for product in products %}
    <a class="block rounded-xl border bg-white p-4" href="{% url 'products:detail' product.slug %}">
      <strong>{{ product.name }}</strong>
      <span class="ml-2 text-sm text-slate-500">{{ product.group.name }} - {{ product.get_status_display }}</span>
    </a>
  {% empty %}
    <p class="rounded-xl border bg-white p-5 text-slate-600">No products yet.</p>
  {% endfor %}
</div>
{% endblock %}
