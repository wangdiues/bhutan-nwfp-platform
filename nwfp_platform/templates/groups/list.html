{% extends "base.html" %}
{% block content %}
<div class="flex items-end justify-between gap-3">
  <div>
    <h1 class="text-3xl font-bold">NWFP Groups</h1>
    <p class="text-slate-500">{{ total_count }} active group records</p>
  </div>
  <a class="rounded-lg bg-emerald-700 px-4 py-2 font-bold text-white" href="{% url 'groups:create' %}">Register Group</a>
</div>
<div class="mt-4 grid gap-4 md:grid-cols-3">
  {% for group in groups %}
    <a class="rounded-xl border bg-white p-4" href="{% url 'groups:detail' group.slug %}">
      <strong>{{ group.name }}</strong>
      <p class="mt-1 text-sm text-slate-500">{{ group.get_dzongkhag_display }} - {{ group.total_members }} members</p>
    </a>
  {% empty %}
    <p class="rounded-xl border bg-white p-5 text-slate-600 md:col-span-3">No active groups yet.</p>
  {% endfor %}
</div>
{% endblock %}
