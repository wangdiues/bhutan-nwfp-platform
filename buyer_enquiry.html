<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buyer Enquiry - Bhutan NWFP Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/nwfp_pages.css">
</head>
<body data-title="NWFP Buyer Enquiry">
  <div class="shell">
    <div id="siteHeader"></div>
    <main class="mx-auto max-w-7xl px-4 py-6">
      <section class="hero-photo rounded-[2rem] p-6 text-white shadow-2xl md:p-10" style="--hero-image:url('assets/nwfp_images/rubia-cordifolia.jpg')">
        <p class="text-xs font-black uppercase tracking-[.18em] text-yellow-300">Buyer enquiry</p>
        <h1 class="mt-4 max-w-4xl text-4xl font-black leading-none md:text-6xl">Request products, quantities, grades, and delivery information.</h1>
      </section>
      <section class="mt-6 grid gap-4 lg:grid-cols-[1fr_22rem]">
        <form class="card rounded-3xl p-6">
          <div class="grid gap-4 md:grid-cols-2">
            <label class="block"><span class="text-xs font-black uppercase tracking-wide text-slate-500">Buyer name</span><input class="field mt-2" placeholder="Organization or person"></label>
            <label class="block"><span class="text-xs font-black uppercase tracking-wide text-slate-500">Email</span><input class="field mt-2" type="email" placeholder="buyer@example.com"></label>
            <label class="block"><span class="text-xs font-black uppercase tracking-wide text-slate-500">Product</span><select class="field mt-2"><option>Cordyceps sinensis</option><option>Matsutake mushroom</option><option>Paris polyphylla</option><option>Rubia cordifolia</option><option>Bamboo / cane</option><option>Daphne spp</option></select></label>
            <label class="block"><span class="text-xs font-black uppercase tracking-wide text-slate-500">Quantity</span><input class="field mt-2" placeholder="Example: 25 kg"></label>
            <label class="block"><span class="text-xs font-black uppercase tracking-wide text-slate-500">Preferred grade</span><input class="field mt-2" placeholder="Fresh, dried, sorted, premium..."></label>
            <label class="block"><span class="text-xs font-black uppercase tracking-wide text-slate-500">Delivery location</span><input class="field mt-2" placeholder="Town, Dzongkhag, country"></label>
          </div>
          <label class="mt-4 block"><span class="text-xs font-black uppercase tracking-wide text-slate-500">Notes</span><textarea class="field mt-2 min-h-32" placeholder="Packaging, timeline, certification, quality requirements..."></textarea></label>
          <button type="button" class="mt-5 rounded-xl bg-emerald-950 px-5 py-3 text-sm font-black text-white hover:bg-emerald-900">Prepare Enquiry</button>
        </form>
        <aside class="card rounded-3xl p-6">
          <p class="kicker">Enquiry checklist</p>
          <h2 class="mt-1 text-2xl font-black text-emerald-950">Include enough detail</h2>
          <div class="mt-5 space-y-3 text-sm font-bold text-slate-700">
            <div class="chip rounded-2xl p-3">Product and species</div>
            <div class="chip rounded-2xl p-3">Quantity and grade</div>
            <div class="chip rounded-2xl p-3">Delivery location</div>
            <div class="chip rounded-2xl p-3">Certification needs</div>
            <div class="chip rounded-2xl p-3">Expected delivery date</div>
          </div>
        </aside>
      </section>
    </main>
    <div id="siteFooter"></div>
  </div>
  <script src="assets/nwfp_plan_data.js"></script>
  <script src="assets/nwfp_pages.js"></script>
</body>
</html>
