name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp *.html public/
          cp DoFPS_Bhutan_Logo.png public/
          cp "Overview of NWFPs in Bhutan.pdf" public/
          cp "COFFEE TABLE BOOK.pdf" public/
          cp national-nwfp-groups.csv public/
          cp "NWFP Group-National Data.xlsx" public/
          cp -R assets public/assets
          cp -R Images public/Images
          cp -R management_plans_nwfp public/management_plans_nwfp
          mkdir -p "public/NWFP Groups Shp Files/outputs"
          cp -R "NWFP Groups Shp Files/outputs/figures" "public/NWFP Groups Shp Files/outputs/figures"
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
